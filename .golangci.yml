run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - noctx
  disable:
    - depguard
    - exhaustruct
    - exhaustive
    - gomnd
    - wrapcheck
    - varnamelen
    - ireturn
    - cyclop
    - funlen
    - gocognit
    - maintidx

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/davidakpele/property-marketplace

issues:
  exclude-rules:
    - path: docs/
      linters:
        - all
    - path: _test\.go
      linters:
        - errcheck
        - unparam
    - path: tests/
      linters:
        - errcheck
        - unparam
  exclude-dirs:
    - docs
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0
