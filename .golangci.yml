run:
  timeout: 5m
  go: "1.23"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - noctx

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/davidakpele/property-marketplace

issues:
  exclude-dirs:
    - docs
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: ^tests/
      linters:
        - errcheck
    - path: ^pkg/database/tracer\.go
      linters:
        - noctx
  max-issues-per-linter: 0
  max-same-issues: 0
