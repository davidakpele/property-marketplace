services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: property_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../configs/application.yaml:/app/configs/application.yaml:ro
      - ../migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - property_net

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: property_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: property_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d property_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - property_net

  redis:
    image: redis:7-alpine
    container_name: property_redis
    restart: unless-stopped
    command: redis-server --requirepass redispass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - property_net

  nginx:
    image: nginx:1.27-alpine
    container_name: property_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - property_net

volumes:
  postgres_data:
  redis_data:

networks:
  property_net:
    driver: bridge
