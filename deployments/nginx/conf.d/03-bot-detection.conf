map $request_uri $is_malicious {
    default 0;

    "~* union.{0,5}select"                       1;
    "~* insert.{0,5}into"                        1;
    "~* delete.{0,5}from"                        1;
    "~* drop.{0,5}table"                         1;
    "~* exec.{0,5}\(|execute.{0,5}\("            1;
    "~* select.{0,5}from|union.{0,5}all"         1;
    "~* <script|</script>|javascript:"           1;
    "~* <iframe|<embed|<object"                  1;
    "~* onerror=|onload=|eval\("                 1;
    "~* \.\.|%2e%2e|\.git|\.env"                 1;
    "~* etc/passwd|etc/shadow|/proc/self"        1;
    "~* %00|\\x00"                               1;
}

map $http_user_agent $is_suspicious {
    default 0;
    ""     1;
    "~*(?i)(python|java|ruby|php|perl|scrapy|curl|wget|http-client)" 1;
    "~*(?i)(nikto|sqlmap|nessus|masscan|dirbuster|wpscan|nuclei)"    1;
    "~*(?i)(bot|crawler|spider|scraper|harvester|collector)"         1;
}

geo $admin_access {
    default       0;
    127.0.0.1     1;
    10.0.0.0/8    1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}
