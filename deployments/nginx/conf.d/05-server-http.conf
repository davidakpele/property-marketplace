server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/conf.d/07-error-pages.conf;
    include /etc/nginx/conf.d/08-security-blocks.conf;

    location = /health {
        access_log off;
        proxy_pass            http://property_api/health;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_set_header      Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    include /etc/nginx/conf.d/10-health-checks.conf;
    include /etc/nginx/conf.d/swagger-locations.conf;

    location /api/v1/listings/search {
        if ($is_malicious) {
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        limit_req zone=search_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass            http://property_api;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID      $req_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       off;

        error_page 502 503 504 = @service_unavailable;
    }

    location /api/v1/ {
        if ($is_malicious) {
            add_header Content-Type application/json always;
            return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED","request_id":"$req_id"}';
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass            http://property_api;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Request-ID      $req_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       off;

        error_page 502 503 504 = @service_unavailable;
    }

    location @api_unavailable {
        add_header Content-Type application/json always;
        return 503 '{"error":"Service temporarily unavailable","code":"SERVICE_UNAVAILABLE","request_id":"$req_id"}';
    }

    location / {
        add_header Content-Type application/json always;
        return 404 '{"success":false,"status":404,"error":"Not Found","message":"The requested resource does not exist.","request_id":"$req_id"}';
    }
}
