location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~ /(\.env|\.git|\.svn|\.htaccess|\.htpasswd|composer\.json|Dockerfile) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* \.(bak|backup|old|orig|save|swp|tmp|log)$ {
    deny all;
    return 404;
}

location ~* "(wp-admin|wp-login|phpmyadmin|phpMyAdmin|adminer|jenkins)" {
    return 404;
}

location ~* "(union\s+select|insert\s+into|delete\s+from|drop\s+table|exec\s*\()" {
    add_header Content-Type application/json always;
    return 403 '{"error":"SQL injection attempt detected","code":"SQLI_BLOCKED","request_id":"$req_id"}';
}

location ~* "(<script|javascript:|onerror=|onload=|eval\()" {
    add_header Content-Type application/json always;
    return 403 '{"error":"XSS attempt detected","code":"XSS_BLOCKED","request_id":"$req_id"}';
}

location ~* "(\.\./|\.\.\\|etc/passwd|windows/system)" {
    add_header Content-Type application/json always;
    return 403 '{"error":"Path traversal attempt detected","code":"PATH_TRAVERSAL_BLOCKED","request_id":"$req_id"}';
}
