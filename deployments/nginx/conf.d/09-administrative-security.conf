location ~ ^/(css|js|fonts|images|img|dist|build|plugins)/ {
    if ($is_malicious) {
        access_log /var/log/nginx/security_blocked.log security_log;
        add_header Content-Type application/json always;
        return 403 '{"error":"Attack pattern detected","code":"ATTACK_BLOCKED"}';
    }

    proxy_pass         http://skulcredit_frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache        static_cache;
    proxy_cache_valid  200 7d;
    add_header         Cache-Control "public, max-age=604800, immutable";
    access_log off;
}

location ^~ /admin/auth {
    proxy_pass          http://skulcredit_frontend;
    proxy_http_version  1.1;
    proxy_set_header    Connection        "";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = @frontend_spa;
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
}

